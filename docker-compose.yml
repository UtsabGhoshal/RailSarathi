version: '3.8'

services:
  # Redis In-Memory Cache (Passwordless by default on port 6379)
  redis:
    image: redis:7-alpine
    container_name: railsarathi-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes

  # PostgreSQL Relational Database
  postgres:
    image: postgres:16-alpine
    container_name: railsarathi-postgres
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-railsarathi}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  redis-data:
  postgres-data:
