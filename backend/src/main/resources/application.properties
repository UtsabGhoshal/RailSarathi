spring.application.name=backend

# PostgreSQL Datasource (overridable via env vars DB_HOST, DB_PORT, DB_NAME, DB_USERNAME, DB_PASSWORD)
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:railsarathi}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Server
server.port=8080

# JWT Configuration
jwt.secret=${JWT_SECRET:4a7261696c736172617468695f7365637572655f6a77745f7365637265745f6b65795f32303236}
jwt.expiration=${JWT_EXPIRATION:86400000}

# CORS Configuration
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# TinyFish AI Configuration (Live Web Scraper & Search)
tinyfish.api.key=${TINYFISH_API_KEY:}
tinyfish.agent.url=${TINYFISH_AGENT_URL:https://agent.tinyfish.ai/v1/automation/run}
tinyfish.search.url=${TINYFISH_SEARCH_URL:https://api.search.tinyfish.ai}
tinyfish.fetch.url=${TINYFISH_FETCH_URL:https://api.fetch.tinyfish.ai}

# Caching Configuration (In-Memory Caffeine with exact TTLs)
spring.cache.type=caffeine
spring.cache.cache-names=train_live_status,stations,train_schedules
app.cache.live-status-ttl-seconds=180
app.cache.schedule-ttl-minutes=30
app.cache.station-ttl-minutes=60



