spring.application.name=backend-test

# In-Memory H2 Database for Isolated Integration Testing
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# JWT Configuration
jwt.secret=4a7261696c736172617468695f7365637572655f6a77745f7365637265745f6b65795f32303236
jwt.expiration=86400000

# CORS
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000

# TinyFish AI Configuration
tinyfish.api.key=sk-tinyfish-dn0ydvNdZQ7tDUmd4_5sti9tfwM5nxlK
tinyfish.agent.url=https://agent.tinyfish.ai/v1/automation/run
tinyfish.search.url=https://api.search.tinyfish.ai
tinyfish.fetch.url=https://api.fetch.tinyfish.ai

# Caching Configuration
spring.cache.type=caffeine
spring.cache.cache-names=train_live_status,stations,train_schedules


